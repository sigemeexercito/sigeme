{% extends "base.html" %}
{% block title %}Gestão de Especialidades{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Gestão de Especialidades</h1>
    <a href="{{ url_for('nova_especialidade') }}" class="btn btn-primary mb-3">+ Nova Especialidade</a>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome da Especialidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for e in especialidades %}
                <tr>
                    <td>{{ e.id }}</td>
                    <td>{{ e.nome }}</td>
                    <td>
                        <a href="{{ url_for('editar_especialidade', id=e.id) }}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="{{ url_for('apagar_especialidade', id=e.id) }}" class="btn btn-danger btn-sm">Apagar</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
