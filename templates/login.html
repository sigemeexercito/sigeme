<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - SIGEME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
    background-color: #f4f6f9;
    font-family: Arial, sans-serif;
}

/* Container maior e espaçoso */
.login-container {
    max-width: 600px;   /* antes 420px */
    margin: 80px auto;  /* mais espaço em cima */
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.25);
    padding: 50px;      /* mais espaço interno */
}

/* Cabeçalho institucional */
.login-header {
    text-align: center;
    margin-bottom: 30px;
}
.login-header img {
    max-height: 140px;
    margin-bottom: 20px;
}
.login-header h2 {
    font-weight: bold;
    color: #004080; /* azul institucional */
    margin-bottom: 8px;
}
.login-header h5 {
    color: #555;
    margin-bottom: 12px;
}
.login-header h1 {
    font-weight: bold;
    font-size: 32px; /* maior */
    color: #000;
}

/* Campos de login mais altos */
.form-control {
    border-radius: 8px;
    padding: 14px;      /* inputs mais altos */
    font-size: 16px;    /* texto maior */
}
.input-group-text {
    background-color: #004080;
    color: #fff;
    border: none;
}

/* Botão maior e destacado */
.btn-login {
    background-color: #004080;
    color: #fff;
    font-weight: bold;
    border-radius: 8px;
    padding: 14px;      /* botão mais alto */
    font-size: 18px;    /* texto maior */
    transition: 0.3s;
}
.btn-login:hover {
    background-color: #002d59;
}

    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <img src="{{ url_for('static', filename='emblema.png') }}" alt="Emblema do Exército">
        <h2>Comando do Ramo do Exército</h2>
        <h5>Sistema de Gestão Militar do Exército</h5>
        <h1>SIGEME</h1>
    </div>

    <form method="post" action="/login">
        <div class="mb-3 input-group">
            <span class="input-group-text">👤</span>
            <input type="text" id="username" name="username" class="form-control" placeholder="Usuário" required>
        </div>
        <div class="mb-3 input-group">
            <span class="input-group-text">🔒</span>
            <input type="password" id="password" name="password" class="form-control" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn btn-login w-100">Entrar</button>
    </form>
</div>

</body>
</html>
