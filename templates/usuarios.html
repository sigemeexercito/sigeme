{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3>Usuários Cadastrados</h3>
    <a href="{{ url_for('add_usuario') }}" class="btn btn-success mb-3">
        <i class="bi bi-person-plus"></i> Novo Usuário
    </a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Usuário</th>
                <th>Perfil</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.nome }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.username }}</td>
                <td>{{ u.perfil }}</td>
                <td>
                    <a href="{{ url_for('editar_usuario', id=u.id) }}" class="btn btn-primary btn-sm">Editar</a>
                    <a href="{{ url_for('apagar_usuario', id=u.id) }}" class="btn btn-danger btn-sm">Apagar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
