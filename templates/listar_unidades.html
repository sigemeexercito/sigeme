{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3>Lista de Unidades</h3>
    <a href="{{ url_for('nova_unidade') }}" class="btn btn-success mb-3">
        <i class="bi bi-building"></i> + Nova Unidade
    </a>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Previsao</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for u in unidades %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.nome }}</td>
                    <td>{% if u.prevista %}Sim{% else %}Não{% endif %}</td>
                    <td class="text-center">
                        <a href="{{ url_for('editar_unidade', id=u.id) }}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <a href="{{ url_for('apagar_unidade', id=u.id) }}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
